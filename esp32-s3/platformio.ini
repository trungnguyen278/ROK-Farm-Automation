; PlatformIO Project Configuration File
;
; Build:   pio run             -> writes ../firmware/*.bin, which is committed
; Flash:   pio run -t upload   -> dev only; end users get tools/flash_board.py
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc1-n16r8]
; pioarduino, not PlatformIO's own espressif32, and pinned to one release.
;
; main.cpp needs USBHIDAbsoluteMouse (path drags), which arrived in
; arduino-esp32 3.1. The registry's platformio/espressif32 still resolves to
; core 2.0.17 at every version tried (6.9.0 and 7.1.2 both), where that class
; does not exist and the build fails on "AbsMouse was not declared". pioarduino
; is the community continuation that ships core 3.x. In 3.x USBHIDMouse is a
; typedef for USBHIDRelativeMouse, so the rest of main.cpp is unchanged.
;
; Pinned because `pio run` reports an unknown board with EXIT CODE 0 -- an
; unpinned platform that drops a board id fails SILENTLY, which is how the
; 7.1.2 breakage got as far as it did.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino

; No espressif32 release ships an N16R8 board id any more, so the 16 MB flash
; is spelled out on top of the base board.
;
; PSRAM is deliberately NOT configured. Setting memory_type = qio_opi (and
; -DBOARD_HAS_PSRAM) to "match" the R8 module bricked the board on
; 2026-09-10: the second-stage bootloader hung initialising octal PSRAM and
; the chip watchdog-reset in a loop --
;   rst:0x7 (TG0WDT_SYS_RST) ... ets_loader.c 78
; over and over, with the HID never enumerating. esptool reports this chip's
; "Flash type set in eFuse: quad". This firmware uses 56 KB of RAM and never
; touches PSRAM, so the whole question is moot: leave it at the default and
; the board boots.
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
	; The base board json defines USB_MODE=1 (CDC). Undefine before overriding
	; or GCC warns on the redefinition. 0 = TinyUSB, which the HID needs.
	-UARDUINO_USB_MODE
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200

; Copy the flashable images into ../firmware/ so end users never need PlatformIO.
extra_scripts = post:export_firmware.py
